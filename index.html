              "D. Đèn ống (đèn huỳnh quang)"
            ],
            correct: 1, 
            explain: ""
          },
          {
            id: 30,
            question: "Câu 30: Việc làm nào sau đây không nên làm trong khi sử dụng đồ dùng điện",
            options: [
              "A. Sử dụng các thiết bị và đồ dùng điện theo đúng hướng dẫn của nhà sản xuất",
              "B. Tắt đèn hay các thiết bị chiếu sáng khi không có ngời sử dụng hoặc khi ra khỏi phòng",
              "C. Khi sử dụng tủ lạnh cần trữ lượng lương thực phẩm vừa đủ, sắp xếp đồ trong các khoang ngăn nắp và thống thoáng",
              "D. Sử dụng các thiết bị có công suất lớn trong giờ cao điểm."
            ],
            correct: 3, 
            explain: ""
          }
        ];

        const PART_II_DATA = [
          {
            id: "II_1",
            mainQuestion: "Câu 1. Có nhiều nguồn năng lượng khác nhau để tạo ra điện như: năng lượng nước, năng lượng gió, năng lượng mặt trời, năng lượng nhiệt, năng lượng hóa học. Hiện nay có một số phương pháp sản xuất điện năng chủ yếu như thủy điện, nhiệt điện, điện hạt nhân, điện gió, điện mặt trời.",
            subQuestions: [
              { id: "a", text: "a. Nhà máy thủy điện sử dụng thế năng của nước trong hồ chứa để chuyển thành động năng làm quay tuabin của máy phát điện tạo ra điện.", correct: true },
              { id: "b", text: "b. Nhà máy nhiệt điện sử dụng nguyên liệu hóa thạch để đốt, đun nóng nước tạo ra hơi nước có áp suất thấp làm quay tuabin của máy phát điện tạo ra điện.", correct: true },
              { id: "c", text: "c. Nhà máy điện hạt nhân sử dụng năng lượng từ phản ứng phân hạch để đun nóng nước tạo ra hơi nước có áp suất thấp làm quay tuabin của máy phát điện tạo ra điện.", correct: true },
              { id: "d", text: "d. Điện gió sử dụng năng lượng gió làm quay tuabin gió của máy phát điện tạo ra điện.", correct: true }
            ]
          },
          {
            id: "II_2",
            mainQuestion: "Câu 2. Gia đình H sống ở chung cư, hiện tại đang sử dụng bếp gas. Gần đây, nhận thấy có rất nhiều sự cố cháy, nổ xảy ra do rò rỉ khí gas, bố H quết định chuyển sang sử dụng bếp từ với công suất 4400 W, hệ số công suất 1,0. Để đảm bảo an toàn khi sử dụng cần phải",
            subQuestions: [
              { id: "a", text: "a. Sử dụng aptomat để làm thiết bị đóng, cắt bảo vệ bếp và chống giật.", correct: true, explain: "" },
              { id: "b", text: "b. Aptomat sử dụng cho bếp từ này là loại MCB1P/16A.", correct: false, explain: "Sai. I = P/U = 4400/220 = 20A. Aptomat 16A sẽ bị nhảy (quá tải)." },
              { id: "c", text: "c. Sử dụng dây dẫn điện có tiết diện 4mm với mật độ dòng J=6 A/mm.", correct: true, explain: "Đúng. I cho phép = 4 * 6 = 24A > 20A." },
              { id: "d", text: "d. Với aptomat và dây dẫn lựa chọn ở trên, bố H yên tâm sử dụng bếp từ với công suất 4400W.", correct: false, explain: "Sai. Vì aptomat 16A ở câu b không chịu được dòng điện 20A của bếp, gây mất điện liên tục." }
            ]
          },
          {
            id: "II_3",
            mainQuestion: "Câu 3: Nhận định nào sau đây là đúng/ sai khi nói về sơ đồ nguyên lí hệ thống điện trong gia đình",
            subQuestions: [
              { id: "a", text: "a) Sơ đồ nguyên lí thể hiện hoạt động và kết nối giữa các thiết bị trong hệ thống điện", correct: true },
              { id: "b", text: "b) Sơ đồ nguyên lí chỉ rõ vị trí lắp đặt cụ thể và khoảng cách đường dây nối giữa chúng", correct: false, explain: "Sai. Đây là đặc điểm của 'Sơ đồ lắp đặt', không phải sơ đồ nguyên lý." },
              { id: "c", text: "c) Để vẽ sơ đồ nguyên lí của hệ thống điện cần phân tích mối liên hệ điện của các phần tử trong hệ thống điện", correct: true },
              { id: "d", text: "d) Bước đầu tiên khi vẽ sơ đồ nguyên lí của hệ thống điện cần thống kê số lượng các thiết bị điện, phần tử đóng cắt, bảo vệ và cấp nguồn", correct: true }
            ]
          },
          {
            id: "II_4",
            mainQuestion: "Câu 4: Nhận định nào sau đây là đúng/ sai khi nói về các yếu tố cần xét đến khi tính toán công suất tiêu thụ của hệ thống điện gia đình",
            subQuestions: [
              { id: "a", text: "a) Khả năng phát triển thêm nhu cầu sử dụng điện trong nhà", correct: true },
              { id: "b", text: "b) Các tải trong hệ thống điện thường không sử dụng đồng thời", correct: true },
              { id: "c", text: "c) Giá thành của các tải tiêu thụ được sử dụng trong nhà", correct: false, explain: "Sai. Giá thành là yếu tố kinh tế, không ảnh hưởng đến kỹ thuật tính toán công suất tiêu thụ điện." },
              { id: "d", text: "d) Xác định tiết diện của dây dẫn", correct: false, explain: "Sai. 'Xác định tiết diện dây dẫn' là bước thực hiện SAU KHI đã tính toán xong công suất, nó là mục đích chứ không phải là yếu tố đầu vào để tính công suất." }
            ]
          }
        ];

        // ============================================================================
        // LOGIC ỨNG DỤNG
        // ============================================================================
        
        let userAnswersPartI = {};
        let userAnswersPartII = {};

        function renderPartI() {
            const container = document.getElementById('part-i-container');
            container.innerHTML = PART_I_DATA.map((q, idx) => {
                const isAnswered = userAnswersPartI.hasOwnProperty(q.id);
                const userAnswer = userAnswersPartI[q.id];
                const isCorrect = userAnswer === q.correct;
                
                let explainHtml = '';
                if (isAnswered) {
                    const styleClass = isCorrect ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800';
                    const text = isCorrect ? 'Chính xác!' : 'Chưa đúng.';
                    explainHtml = `
                        <div class="mt-3 text-sm p-3 rounded border ${styleClass}">
                            <span class="font-bold mr-2">${text}</span>
                            <span>${q.explain || ''}</span>
                        </div>
                    `;
                }

                return `
                <div class="p-4 bg-gray-50 rounded-lg border border-gray-100 hover:border-blue-100 transition-colors">
                    <h3 class="font-semibold text-lg text-gray-900 mb-3">${q.question}</h3>
                    <div class="space-y-2">
                        ${q.options.map((opt, optIdx) => {
                            let btnClass = "option-btn w-full text-left p-3 rounded-md border flex items-center justify-between group ";
                            let icon = "";

                            if (!isAnswered) {
                                btnClass += "bg-white border-gray-200 hover:bg-blue-50 hover:border-blue-300 text-gray-700 cursor-pointer";
                            } else {
                                if (optIdx === q.correct) {
                                    btnClass += "bg-green-100 border-green-500 text-green-900 font-medium";
                                    icon = '<i data-lucide="check-circle" class="w-5 h-5 text-green-600"></i>';
                                } else if (optIdx === userAnswer && optIdx !== q.correct) {
                                    btnClass += "bg-red-100 border-red-500 text-red-900";
                                    icon = '<i data-lucide="x-circle" class="w-5 h-5 text-red-600"></i>';
                                } else {
                                    btnClass += "bg-gray-100 border-gray-200 text-gray-400 opacity-60";
                                }
                            }

                            return `
                                <button onclick="handleSelectPartI(${q.id}, ${optIdx})" class="${btnClass}">
                                    <span>${opt}</span>
                                    ${icon}
                                </button>
                            `;
                        }).join('')}
                    </div>
                    ${explainHtml}
                </div>`;
            }).join('');
            
            lucide.createIcons(); // Refresh icons
        }

        function renderPartII() {
            const container = document.getElementById('part-ii-container');
            container.innerHTML = PART_II_DATA.map((q) => {
                return `
                <div class="border-b border-gray-100 last:border-0 pb-6">
                    <h3 class="font-bold text-lg text-gray-900 mb-4">${q.mainQuestion}</h3>
                    <div class="grid gap-3">
                        ${q.subQuestions.map((sub) => {
                            const userKey = `${q.id}_${sub.id}`;
                            const userChoice = userAnswersPartII[userKey]; // true/false/undefined
                            const isAnswered = userChoice !== undefined;
                            const isCorrect = userChoice === sub.correct;
                            
                            // Nut Dung
                            let trueBtnClass = "px-4 py-2 rounded font-medium border flex items-center gap-2 transition-all ";
                            if (isAnswered) {
                                if (sub.correct === true) trueBtnClass += "bg-green-100 border-green-500 text-green-800";
                                else if (userChoice === true) trueBtnClass += "bg-red-100 border-red-500 text-red-800 opacity-50";
                                else trueBtnClass += "opacity-30";
                            } else {
                                trueBtnClass += "bg-white hover:bg-green-50 text-gray-600 border-gray-300";
                            }
                            if (isAnswered && userChoice === true) trueBtnClass += " ring-2 ring-offset-1 ring-blue-400";

                            // Nut Sai
                            let falseBtnClass = "px-4 py-2 rounded font-medium border flex items-center gap-2 transition-all ";
                            if (isAnswered) {
                                if (sub.correct === false) falseBtnClass += "bg-green-100 border-green-500 text-green-800";
                                else if (userChoice === false) falseBtnClass += "bg-red-100 border-red-500 text-red-800 opacity-50";
                                else falseBtnClass += "opacity-30";
                            } else {
                                falseBtnClass += "bg-white hover:bg-red-50 text-gray-600 border-gray-300";
                            }
                            if (isAnswered && userChoice === false) falseBtnClass += " ring-2 ring-offset-1 ring-blue-400";

                            let icon = "";
                            let explainHtml = "";
                            if (isAnswered) {
                                icon = isCorrect 
                                    ? '<div class="md:w-6 flex justify-center"><i data-lucide="check-circle" class="text-green-500 w-6 h-6"></i></div>'
                                    : '<div class="md:w-6 flex justify-center"><i data-lucide="x-circle" class="text-red-500 w-6 h-6"></i></div>';
                                
                                if (!isCorrect && sub.explain) {
                                    explainHtml = `<div class="w-full md:w-auto md:max-w-xs text-xs text-red-600 bg-red-50 p-2 rounded">${sub.explain}</div>`;
                                }
                            }

                            return `
                                <div class="bg-gray-50 p-4 rounded-lg flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div class="flex-1 text-gray-800">${sub.text}</div>
                                    <div class="flex gap-2 shrink-0">
                                        <button onclick="handleSelectPartII('${q.id}', '${sub.id}', true)" class="${trueBtnClass}">Đúng</button>
                                        <button onclick="handleSelectPartII('${q.id}', '${sub.id}', false)" class="${falseBtnClass}">Sai</button>
                                    </div>
                                    ${icon}
                                    ${explainHtml}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function handleSelectPartI(questionId, optionIndex) {
            userAnswersPartI[questionId] = optionIndex;
            updateScore();
            renderPartI();
        }

        function handleSelectPartII(qId, subId, value) {
            userAnswersPartII[`${qId}_${subId}`] = value;
            updateScore();
            renderPartII();
        }

        function updateScore() {
            let newScore = 0;
            // Part I
            PART_I_DATA.forEach(q => {
                if (userAnswersPartI[q.id] === q.correct) newScore += 0.25;
            });
            // Part II
            PART_II_DATA.forEach(q => {
                q.subQuestions.forEach(sub => {
                    const userKey = `${q.id}_${sub.id}`;
                    if (userAnswersPartII[userKey] === sub.correct) newScore += 0.1;
                });
            });
            document.getElementById('score-display').textContent = newScore.toFixed(2);
        }

        function resetQuiz() {
            userAnswersPartI = {};
            userAnswersPartII = {};
            updateScore();
            renderPartI();
            renderPartII();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderPartI();
            renderPartII();
            lucide.createIcons();
        });

    </script>
</body>
</html>
